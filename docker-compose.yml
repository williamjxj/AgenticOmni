# Postgres and Redis are required. ClamAV is optional (profile: clamav).
# Note: clamav/clamav does not provide linux/arm64; use profile only on x86 or when arm64 image exists.
services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: agenticomni-postgres
    environment:
      POSTGRES_DB: agenticomni
      POSTGRES_USER: agenti_user
      POSTGRES_PASSWORD: agenti_user
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenti_user -d agenticomni"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - agenticomni-network

  redis:
    image: redis:7-alpine
    container_name: agenticomni-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - agenticomni-network
    command: redis-server --appendonly yes
    volumes:
      version: '3.9'

      services:
        backend:
          build: ./backend
          command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
          volumes:
            - ./backend:/app/backend
          environment:
            - DATABASE_URL=postgresql+asyncpg://user:pass@db:5432/agenticomni
            - REDIS_URL=redis://redis:6379/1
          ports:
            - "8000:8000"
          depends_on:
            - db
            - redis

        frontend:
          build: ./frontend
          command: npm run dev
          volumes:
            - ./frontend:/app/frontend
          ports:
            - "3000:3000"
          environment:
            - NEXT_PUBLIC_API_URL=http://localhost:8000

        db:
          image: ankane/pgvector
          environment:
            POSTGRES_DB: agenticomni
            POSTGRES_USER: user
            POSTGRES_PASSWORD: pass
          ports:
            - "5432:5432"
          volumes:
            - pgdata:/var/lib/postgresql/data

        redis:
          image: redis:7
          ports:
            - "6379:6379"
          volumes:
            - redisdata:/data

      volumes:
        pgdata:
        redisdata:
