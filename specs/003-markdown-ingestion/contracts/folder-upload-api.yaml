openapi: 3.0.3
info:
  title: Folder Upload API - Markdown Ingestion
  description: |
    API endpoints for uploading folders containing markdown files with recursive discovery.
    Supports batch processing of entire folder structures with progress tracking.
  version: 1.0.0
  contact:
    name: AgenticOmni API Support
    email: api@agenticomni.example.com

servers:
  - url: http://localhost:8000/api/v1
    description: Local development server
  - url: https://api.agenticomni.example.com/v1
    description: Production server

paths:
  /documents/upload-folder:
    post:
      summary: Upload folder with markdown files
      description: |
        Upload an entire folder structure containing markdown files. The system will:
        1. Recursively discover all .md and .markdown files
        2. Create a FolderBatch to track overall progress
        3. Queue individual parsing tasks for each discovered file
        4. Handle symbolic links and circular references safely
        
        Maximum 500 files per folder upload.
      operationId: uploadFolder
      tags:
        - Folder Upload
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - files
                - tenant_id
                - user_id
              properties:
                files:
                  type: array
                  description: |
                    Array of files from folder. Each file includes relative path information.
                    Use FormData with multiple file inputs preserving directory structure.
                  items:
                    type: string
                    format: binary
                  maxItems: 500
                tenant_id:
                  type: integer
                  format: int64
                  description: Tenant identifier for multi-tenant isolation
                  example: 1
                user_id:
                  type: integer
                  format: int64
                  description: User initiating the upload
                  example: 42
                folder_name:
                  type: string
                  description: Original folder name (for display purposes)
                  maxLength: 500
                  example: "documentation"
                preserve_structure:
                  type: boolean
                  description: Whether to preserve folder hierarchy in document paths
                  default: true
            encoding:
              files:
                contentType: text/markdown, text/plain
      responses:
        '201':
          description: Folder batch created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderBatchResponse'
              examples:
                successful_upload:
                  value:
                    batch_id: 123
                    folder_name: "documentation"
                    total_files_discovered: 47
                    files_processed: 0
                    files_failed: 0
                    status: "discovering"
                    status_url: "/api/v1/documents/folder-batches/123"
                    created_at: "2026-01-10T10:30:00Z"
                    estimated_completion_seconds: 141
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                too_many_files:
                  value:
                    error: "BadRequest"
                    message: "Folder contains 523 files, exceeding limit of 500"
                    details:
                      max_files: 500
                      discovered_files: 523
                no_markdown_files:
                  value:
                    error: "BadRequest"
                    message: "No markdown files found in uploaded folder"
        '401':
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                quota_exceeded:
                  value:
                    error: "QuotaExceeded"
                    message: "Tenant storage quota exceeded"
                    details:
                      quota_used_mb: 980
                      quota_limit_mb: 1000
                      additional_required_mb: 35
        '413':
          description: Payload too large - folder size exceeds limits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /documents/folder-batches/{batch_id}:
    get:
      summary: Get folder batch status
      description: |
        Retrieve current status and progress of a folder upload batch.
        Includes list of discovered documents and their processing status.
      operationId: getFolderBatchStatus
      tags:
        - Folder Upload
      security:
        - BearerAuth: []
      parameters:
        - name: batch_id
          in: path
          required: true
          description: Folder batch identifier
          schema:
            type: integer
            format: int64
          example: 123
        - name: include_documents
          in: query
          required: false
          description: Include detailed document list in response
          schema:
            type: boolean
            default: true
        - name: page
          in: query
          required: false
          description: Page number for document list pagination
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          description: Documents per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Folder batch status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderBatchDetailResponse'
              examples:
                processing:
                  value:
                    batch_id: 123
                    folder_name: "documentation"
                    folder_path: "/uploads/tenant_1/batch_123/"
                    total_files_discovered: 47
                    files_processed: 28
                    files_failed: 1
                    status: "processing"
                    progress_percentage: 59.6
                    created_at: "2026-01-10T10:30:00Z"
                    updated_at: "2026-01-10T10:32:15Z"
                    completed_at: null
                    estimated_completion_seconds: 57
                    documents:
                      total: 47
                      page: 1
                      page_size: 20
                      items:
                        - document_id: 1001
                          filename: "api-overview.md"
                          relative_path: "api/overview.md"
                          status: "completed"
                          file_size: 15234
                        - document_id: 1002
                          filename: "authentication.md"
                          relative_path: "api/authentication.md"
                          status: "parsing"
                          progress: 45
                completed:
                  value:
                    batch_id: 124
                    folder_name: "specs"
                    total_files_discovered: 10
                    files_processed: 10
                    files_failed: 0
                    status: "completed"
                    progress_percentage: 100.0
                    created_at: "2026-01-10T09:00:00Z"
                    updated_at: "2026-01-10T09:02:30Z"
                    completed_at: "2026-01-10T09:02:30Z"
                partial_failure:
                  value:
                    batch_id: 125
                    folder_name: "legacy-docs"
                    total_files_discovered: 50
                    files_processed: 47
                    files_failed: 3
                    status: "partial_failure"
                    progress_percentage: 94.0
                    error_summary:
                      - document_id: 2005
                        filename: "corrupted.md"
                        error: "Invalid UTF-8 encoding"
                      - document_id: 2018
                        filename: "large-file.md"
                        error: "File size exceeds limit"
        '404':
          description: Folder batch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    FolderBatchResponse:
      type: object
      required:
        - batch_id
        - folder_name
        - total_files_discovered
        - status
        - status_url
        - created_at
      properties:
        batch_id:
          type: integer
          format: int64
          description: Unique folder batch identifier
          example: 123
        folder_name:
          type: string
          description: Original folder name
          example: "documentation"
        total_files_discovered:
          type: integer
          description: Number of markdown files discovered in folder
          example: 47
        files_processed:
          type: integer
          description: Number of files successfully processed
          default: 0
          example: 0
        files_failed:
          type: integer
          description: Number of files that failed processing
          default: 0
          example: 0
        status:
          type: string
          enum: [discovering, processing, completed, partial_failure, failed]
          description: Current batch status
          example: "discovering"
        status_url:
          type: string
          format: uri
          description: URL to poll for batch status updates
          example: "/api/v1/documents/folder-batches/123"
        created_at:
          type: string
          format: date-time
          description: Batch creation timestamp
          example: "2026-01-10T10:30:00Z"
        estimated_completion_seconds:
          type: integer
          description: Estimated time to completion (seconds)
          example: 141

    FolderBatchDetailResponse:
      allOf:
        - $ref: '#/components/schemas/FolderBatchResponse'
        - type: object
          properties:
            folder_path:
              type: string
              description: Server storage path for uploaded folder
              example: "/uploads/tenant_1/batch_123/"
            progress_percentage:
              type: number
              format: float
              description: Processing progress (0-100)
              example: 59.6
            updated_at:
              type: string
              format: date-time
              description: Last status update timestamp
              example: "2026-01-10T10:32:15Z"
            completed_at:
              type: string
              format: date-time
              nullable: true
              description: Batch completion timestamp
              example: null
            error_summary:
              type: array
              description: Summary of failed documents (if any)
              items:
                type: object
                properties:
                  document_id:
                    type: integer
                    format: int64
                  filename:
                    type: string
                  error:
                    type: string
            documents:
              type: object
              description: Paginated list of documents in batch
              properties:
                total:
                  type: integer
                  description: Total documents in batch
                page:
                  type: integer
                  description: Current page number
                page_size:
                  type: integer
                  description: Documents per page
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/BatchDocumentSummary'

    BatchDocumentSummary:
      type: object
      required:
        - document_id
        - filename
        - status
      properties:
        document_id:
          type: integer
          format: int64
          description: Document identifier
          example: 1001
        filename:
          type: string
          description: Document filename
          example: "api-overview.md"
        relative_path:
          type: string
          description: Relative path within folder structure
          example: "api/overview.md"
        status:
          type: string
          enum: [pending, parsing, completed, failed]
          description: Document processing status
          example: "completed"
        progress:
          type: integer
          description: Parsing progress (0-100), only for status=parsing
          minimum: 0
          maximum: 100
          example: 45
        file_size:
          type: integer
          format: int64
          description: File size in bytes
          example: 15234
        error_message:
          type: string
          description: Error details if status=failed
          example: "Invalid UTF-8 encoding"

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code/type
          example: "QuotaExceeded"
        message:
          type: string
          description: Human-readable error message
          example: "Tenant storage quota exceeded"
        details:
          type: object
          description: Additional error context
          additionalProperties: true
        request_id:
          type: string
          format: uuid
          description: Unique request identifier for debugging
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"

tags:
  - name: Folder Upload
    description: Bulk folder upload and batch processing operations
